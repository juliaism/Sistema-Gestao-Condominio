<!DOCTYPE html>
<!--
    index.html
    Ponto de entrada do sistema e página inicial após o login (fora do
    calendário). Se ninguém estiver logado, redireciona para pages/login.html.
    Reúne as informações principais do usuário: saudação, atalhos, próximos
    eventos do condomínio, reservas e dados/permissões do perfil. O conteúdo
    muda conforme o perfil (Síndica ou Morador) e é montado por Inicio.js.
    Os dados mockados ficam no menu lateral da direita (DadosTeste.js).

    data-raiz="" no <body>: esta página está na raiz do projeto
    (usado por caminho() em Comum.js para montar os links).
-->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início | Gestão Condominial</title>
    <!-- Estilos compartilhados das telas do sistema -->
    <link rel="stylesheet" href="css/Sistema.css" />
</head>
<body data-raiz="">
    <!-- Cabeçalho com menu e usuário logado, montado por renderizarTopo() em Comum.js -->
    <header id="topo" class="topo"></header>

    <main class="pagina">
        <div class="inicio">

            <!-- Saudação, data de hoje e atalhos para as ações do perfil -->
            <section class="painel boas-vindas">
                <div>
                    <h1 id="saudacao" class="boas-vindas-titulo">Olá!</h1>
                    <p id="data-hoje" class="boas-vindas-data"></p>
                </div>
                <div id="acoes-rapidas" class="acoes-rapidas"></div>
            </section>

            <!-- Grade com os painéis de informação -->
            <div class="inicio-grade">

                <!-- Próximos eventos do condomínio (os mesmos do calendário) -->
                <section class="painel">
                    <div class="painel-cabecalho">
                        <h2 class="painel-titulo">Próximos eventos</h2>
                        <a class="painel-link" href="pages/calendario-condominial.html">Ver calendário</a>
                    </div>
                    <ul id="proximos-eventos" class="lista-eventos"></ul>
                </section>

                <!-- Reservas: as do morador, ou todas no caso da síndica -->
                <section class="painel">
                    <div class="painel-cabecalho">
                        <h2 id="titulo-reservas" class="painel-titulo">Minhas reservas</h2>
                        <a id="link-nova-reserva" class="painel-link" href="pages/reservas.html">Nova reserva</a>
                    </div>
                    <ul id="lista-reservas-inicio" class="lista-eventos"></ul>
                </section>

                <!-- Dados do usuário e permissões do perfil -->
                <section class="painel">
                    <h2 class="painel-titulo">Seu perfil</h2>
                    <dl id="dados-perfil" class="dados-perfil"></dl>
                    <h3 class="subtitulo">O que você pode fazer</h3>
                    <ul id="permissoes" class="lista-permissoes"></ul>
                </section>
            </div>
        </div>
    </main>

    <!-- Ordem importa: dados mockados -> funções comuns -> lógica da tela -->
    <script src="js/DadosMock.js"></script>
    <script src="js/Comum.js"></script>
    <script src="js/Inicio.js"></script>
    <script src="js/DadosTeste.js"></script>
</body>
</html>
