<!DOCTYPE html>
<!--
    calendario-condominial.html
    Página principal após o login. Mostra o calendário do condomínio
    (reaproveitando Calendario.js e Calendario.css) e, ao lado, o painel
    de registro de eventos, liberado apenas para a síndica (administrador).

    data-raiz="../" no <body>: esta página está um nível abaixo da raiz
    (usado por caminho() em Comum.js para montar os links).
-->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendário Condominial | Gestão Condominial</title>
    <!-- Estilos do calendário (arquivo original) -->
    <link rel="stylesheet" href="../css/Calendario.css" />
    <!-- Estilos das telas novas; vem depois para ajustar o layout da página -->
    <link rel="stylesheet" href="../css/Sistema.css" />
</head>
<body data-raiz="../">
    <!-- Cabeçalho com menu e usuário logado, montado por renderizarTopo() em Comum.js -->
    <header id="topo" class="topo"></header>

    <main class="pagina">
        <!-- "layout" coloca o calendário e o painel lado a lado (ou empilhados no celular) -->
        <div class="layout">

            <!-- Calendário: o Calendario.js procura estes elementos pelo id.
                 O registro de eventos é feito no painel ao lado, que verifica
                 a permissão do usuário. -->
            <div class="container">
                <h1 class="header-title" style="text-align: center;">Calendário</h1>

                <!-- Navegação entre meses -->
                <div class="calendar-navigation">
                    <button id="prev-month" class="arrow-btn">&lt;</button>
                    <span id="month-title">Outubro 2026</span>
                    <button id="next-month" class="arrow-btn">&gt;</button>
                </div>

                <!-- Grade do mês: nomes dos dias + dias gerados pelo Calendario.js -->
                <div class="calendar-grid">
                    <div class="day-name">Dom</div>
                    <div class="day-name">Seg</div>
                    <div class="day-name">Ter</div>
                    <div class="day-name">Qua</div>
                    <div class="day-name">Qui</div>
                    <div class="day-name">Sex</div>
                    <div class="day-name">Sáb</div>

                    <div id="calendar-days" class="days-container"></div>
                </div>

                <!-- Lista de eventos do dia clicado (aparece ao clicar em um dia) -->
                <div id="list-container" class="list-container hidden">
                    <h2 id="calendar-description" class="calendar-description">Eventos em:</h2>
                    <div id="events-list"></div>
                </div>
            </div>

            <!-- Painel de registro de eventos (controlado por RegistroEvento.js) -->
            <section class="painel">
                <h2 class="painel-titulo">Eventos e avisos</h2>
                <p class="painel-texto">
                    Avisos, manutenções, assembleias e eventos são registrados apenas pela síndica
                    e ficam visíveis para todos. As reservas de áreas comuns também aparecem no calendário.
                </p>

                <!-- Mensagens de sucesso, erro de validação ou acesso negado -->
                <div id="mensagem-evento" class="mensagem hidden" role="alert"></div>

                <!-- Abre o formulário (síndica) ou mostra "Acesso negado" (morador) -->
                <button id="btn-novo-evento" type="button" class="btn btn-primario btn-bloco">Registrar evento</button>

                <!-- Formulário do evento; começa escondido -->
                <form id="form-evento" class="formulario hidden" novalidate>
                    <label class="campo">
                        Título
                        <input type="text" id="evento-titulo" maxlength="80" required>
                    </label>
                    <!-- Tipos preenchidos por RegistroEvento.js a partir de tiposEventoMock -->
                    <label class="campo">
                        Tipo
                        <select id="evento-tipo" required></select>
                    </label>
                    <label class="campo">
                        Data
                        <input type="date" id="evento-data" required>
                    </label>
                    <!-- Início e término lado a lado -->
                    <div class="campo-linha">
                        <label class="campo">
                            Início
                            <input type="time" id="evento-inicio" required>
                        </label>
                        <label class="campo">
                            Término
                            <input type="time" id="evento-fim" required>
                        </label>
                    </div>
                    <label class="campo">
                        <span>Local <span class="campo-ajuda">(opcional)</span></span>
                        <input type="text" id="evento-local" maxlength="60">
                    </label>
                    <div class="form-acoes">
                        <button type="button" id="btn-cancelar-evento" class="btn btn-secundario">Cancelar</button>
                        <button type="submit" class="btn btn-primario">Salvar</button>
                    </div>
                </form>
            </section>
        </div>
    </main>

    <!-- Ordem importa: RegistroEvento.js usa variáveis e funções do Calendario.js,
         por isso é carregado por último. -->
    <script src="../js/DadosMock.js"></script>
    <script src="../js/Comum.js"></script>
    <script src="../js/Calendario.js"></script>
    <script src="../js/RegistroEvento.js"></script>
    <script src="../js/DadosTeste.js"></script>
</body>
</html>
