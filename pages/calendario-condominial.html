<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendário Condominial | Gestão Condominial</title>
    <link rel="stylesheet" href="../css/Calendario.css" />
    <link rel="stylesheet" href="../css/Sistema.css" />
</head>
<body data-raiz="../">
    <header id="topo" class="topo"></header>

    <main class="pagina">
        <div class="layout">

            <div class="container">
                <h1 class="header-title" style="text-align: center;">Calendário</h1>

                <div class="calendar-navigation">
                    <button id="prev-month" class="arrow-btn">&lt;</button>
                    <span id="month-title">Outubro 2026</span>
                    <button id="next-month" class="arrow-btn">&gt;</button>
                </div>

                <div class="calendar-grid">
                    <div class="day-name">Dom</div>
                    <div class="day-name">Seg</div>
                    <div class="day-name">Ter</div>
                    <div class="day-name">Qua</div>
                    <div class="day-name">Qui</div>
                    <div class="day-name">Sex</div>
                    <div class="day-name">Sáb</div>

                    <div id="calendar-days" class="days-container"></div>
                </div>

                <div id="list-container" class="list-container hidden">
                    <h2 id="calendar-description" class="calendar-description">Eventos em:</h2>
                    <div id="events-list"></div>
                </div>
            </div>

            <section class="painel">
                <h2 class="painel-titulo">Eventos e avisos</h2>
                <p class="painel-texto">
                    Avisos, manutenções, assembleias e eventos são registrados apenas pela síndica
                    e ficam visíveis para todos. As reservas de áreas comuns também aparecem no calendário.
                </p>

                <div id="mensagem-evento" class="mensagem hidden" role="alert"></div>

                <button id="btn-novo-evento" type="button" class="btn btn-primario btn-bloco">Registrar evento</button>

                <form id="form-evento" class="formulario hidden" novalidate>
                    <label class="campo">
                        Título
                        <input type="text" id="evento-titulo" maxlength="80" required>
                    </label>
                    <label class="campo">
                        Tipo
                        <select id="evento-tipo" required></select>
                    </label>
                    <label class="campo">
                        Data
                        <input type="date" id="evento-data" required>
                    </label>
                    <div class="campo-linha">
                        <label class="campo">
                            Início
                            <input type="time" id="evento-inicio" required>
                        </label>
                        <label class="campo">
                            Término
                            <input type="time" id="evento-fim" required>
                        </label>
                    </div>
                    <label class="campo">
                        <span>Local <span class="campo-ajuda">(opcional)</span></span>
                        <input type="text" id="evento-local" maxlength="60">
                    </label>
                    <div class="form-acoes">
                        <button type="button" id="btn-cancelar-evento" class="btn btn-secundario">Cancelar</button>
                        <button type="submit" class="btn btn-primario">Salvar</button>
                    </div>
                </form>
            </section>
        </div>
    </main>

    
    <script src="../js/DadosMock.js"></script>
    <script src="../js/Comum.js"></script>
    <script src="../js/Calendario.js"></script>
    <script src="../js/RegistroEvento.js"></script>
    <script src="../js/DadosTeste.js"></script>
</body>
</html>
